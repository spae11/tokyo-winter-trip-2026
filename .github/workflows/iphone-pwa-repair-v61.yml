name: Repair iPhone PWA v61

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iphone-pwa-repair-v61.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-pwa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rebuild known-good white iPhone icon and force PWA refresh
        run: |
          python -m pip install --quiet pillow
          git show 81895d6db31d0e5e64a3125ca5fc0b9b2172cae5:apple-touch-icon-180x180.png > /tmp/our-journey-good-icon.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, math, re

          root = Path('.')
          src = Image.open('/tmp/our-journey-good-icon.png').convert('RGB')
          if src.size != (180, 180):
              raise SystemExit(f'Unexpected source icon size: {src.size}')

          # The known-good artwork is the blue/green globe. Convert only its warm
          # off-white canvas to pure white, keeping antialiased globe edges smooth.
          bg = src.getpixel((0, 0))
          rgba = Image.new('RGBA', src.size, (255, 255, 255, 0))
          sp = src.load(); rp = rgba.load()
          for y in range(src.height):
              for x in range(src.width):
                  r,g,b = sp[x,y]
                  d = math.sqrt((r-bg[0])**2 + (g-bg[1])**2 + (b-bg[2])**2)
                  a = max(0, min(255, round((d - 2.0) / 26.0 * 255.0)))
                  rp[x,y] = (r,g,b,a)
          white = Image.new('RGBA', src.size, (255,255,255,255))
          clean = Image.alpha_composite(white, rgba).convert('RGB')
          for size in (180,192,512):
              im = clean if size == 180 else clean.resize((size,size), Image.Resampling.LANCZOS)
              im.save(root / f'our-journey-icon-{size}-v5.png', 'PNG', optimize=True)

          # Manifest: brand-new icon URLs and start URL so iOS does not reuse the
          # previous broken black icon / stale standalone launch entry.
          manifest_path = root / 'manifest.webmanifest'
          m = json.loads(manifest_path.read_text(encoding='utf-8'))
          m['start_url'] = '/tokyo-winter-trip-2026/?pwa=23&app=61'
          m['icons'] = [
              {'src':'/tokyo-winter-trip-2026/our-journey-icon-180-v5.png','sizes':'180x180','type':'image/png','purpose':'any'},
              {'src':'/tokyo-winter-trip-2026/our-journey-icon-192-v5.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'/tokyo-winter-trip-2026/our-journey-icon-512-v5.png','sizes':'512x512','type':'image/png','purpose':'any maskable'},
          ]
          manifest_path.write_text(json.dumps(m, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          # Root page: fresh manifest/icon URLs and a service-worker registration
          # that bypasses HTTP cache, checks immediately, and reloads once when the
          # new worker takes control. The old code was still registering sw.js?v=26.
          index_path = root / 'index.html'
          text = index_path.read_text(encoding='utf-8')
          text = re.sub(r'manifest\.webmanifest\?v=\d+', 'manifest.webmanifest?v=61', text)
          for size in ('180','192','512'):
              text = re.sub(rf'our-journey-icon-{size}-v\d+\.png(?:\?v=\d+)?', f'our-journey-icon-{size}-v5.png?v=61', text)
          old = "if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=26');"
          new = "if('serviceWorker'in navigator){const swReloadKey='ourJourneySWReloadV61';navigator.serviceWorker.addEventListener('controllerchange',()=>{if(sessionStorage.getItem(swReloadKey))return;sessionStorage.setItem(swReloadKey,'1');location.reload()});navigator.serviceWorker.register('./sw.js?v=61',{updateViaCache:'none'}).then(r=>{r.update();if(r.waiting)r.waiting.postMessage('SKIP_WAITING')}).catch(()=>{})};"
          if old not in text:
              text = re.sub(r"if\('serviceWorker'in navigator\)navigator\.serviceWorker\.register\('\./sw\.js\?v=\d+'\);", new, text, count=1)
          else:
              text = text.replace(old, new)
          index_path.write_text(text, encoding='utf-8')

          # Service worker: new cache generation + new icon filenames. Keep
          # navigation network-first/no-store and make waiting-worker activation explicit.
          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE='our-journey-v\d+'", "const CACHE='our-journey-v61'", sw, count=1)
          for size in ('180','192','512'):
              sw = re.sub(rf'our-journey-icon-{size}-v\d+\.png', f'our-journey-icon-{size}-v5.png', sw)
          sw = re.sub(r'\?v=60', '?v=61', sw)
          sw = re.sub(r'ui-motion-v1\.js\?v=\d+', 'ui-motion-v1.js?v=4', sw)
          if "SKIP_WAITING" not in sw:
              marker = "self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)))});"
              sw = sw.replace(marker, marker + "\nself.addEventListener('message',e=>{if(e.data==='SKIP_WAITING')self.skipWaiting()});")
          sw_path.write_text(sw, encoding='utf-8')

          # Remove every broken generated app-icon generation so no current file
          # reference can accidentally point back to the dark/black icon.
          for version in ('v2','v3','v4'):
              for size in ('180','192','512'):
                  p = root / f'our-journey-icon-{size}-{version}.png'
                  if p.exists(): p.unlink()
          PY

          rm -f .github/workflows/iphone-pwa-repair-v61.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix iPhone PWA refresh and restore white app icon'
          git push
