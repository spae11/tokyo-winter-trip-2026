name: Hong Kong Real Hotel Budget v82

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hongkong-real-hotel-budget-v82.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply realistic Hong Kong hotel budget
        run: python3 scripts/hongkong_real_hotel_budget_v82.py
      - name: Validate JavaScript
        run: |
          node --check trip-tools-v1.js
          node --check plan-extras-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip-tools-v1.js plan-extras-v1.js sw.js index.html manifest.webmanifest
          git commit -m "Use realistic Hong Kong hotel rate" || exit 0
          git push
