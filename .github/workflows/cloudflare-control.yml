name: Cloudflare Control Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-control.yml'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-travel-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRAVEL_SYNC_KEY: ${{ secrets.TRAVEL_SYNC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TRAVEL_SYNC_KEY"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure D1 database exists
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          get_id() {
            wrangler d1 list --json | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                const list=JSON.parse(s);
                const db=list.find(x=>x.name==="travel-hub-db");
                if(db) process.stdout.write(db.uuid || db.id || "");
              });
            '
          }
          DB_ID="$(get_id)"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create travel-hub-db --location apac
            DB_ID="$(get_id)"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Check or create R2 media bucket
        id: r2
        shell: bash
        run: |
          set +e
          LIST="$(wrangler r2 bucket list 2>&1)"
          RC=$?
          READY=false
          if [ $RC -eq 0 ]; then
            if echo "$LIST" | grep -q 'travel-hub-media'; then
              READY=true
            else
              wrangler r2 bucket create travel-hub-media >/tmp/r2-create.log 2>&1
              if [ $? -eq 0 ]; then READY=true; fi
            fi
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "::warning::R2 permission is missing. App data + recovery will deploy now; photo/QR sync will enable after the API token gets R2 edit permission."
          fi
          exit 0

      - name: Generate Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          R2_READY: ${{ steps.r2.outputs.ready }}
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const c={
            name:'travel-hub-api',
            main:'cloudflare/worker.js',
            compatibility_date:'2026-08-15',
            workers_dev:true,
            d1_databases:[{binding:'DB',database_name:'travel-hub-db',database_id:process.env.DB_ID}]
          };
          if(process.env.R2_READY==='true') c.r2_buckets=[{binding:'MEDIA',bucket_name:'travel-hub-media'}];
          fs.writeFileSync('wrangler.generated.jsonc',JSON.stringify(c,null,2));
          NODE

      - name: Apply D1 schema
        run: wrangler d1 execute travel-hub-db --remote --file=cloudflare/schema.sql

      - name: Deploy Worker
        run: wrangler deploy --config wrangler.generated.jsonc

      - name: Set server-only sync secret
        shell: bash
        run: printf '%s' "$TRAVEL_SYNC_KEY" | wrangler secret put TRAVEL_SYNC_KEY --config wrangler.generated.jsonc

      - name: Verify Worker health
        shell: bash
        run: |
          sleep 2
          curl --fail --silent --show-error https://travel-hub-api.mlrkdee44.workers.dev/health

      - name: Summary
        env:
          R2_READY: ${{ steps.r2.outputs.ready }}
        shell: bash
        run: |
          echo "### Cloudflare Travel Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: travel-hub-api" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1 full app sync + Recovery: enabled" >> "$GITHUB_STEP_SUMMARY"
          if [ "$R2_READY" = "true" ]; then
            echo "- R2 photo/QR sync: enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- R2 photo/QR sync: waiting for API token R2 Edit permission" >> "$GITHUB_STEP_SUMMARY"
          fi
