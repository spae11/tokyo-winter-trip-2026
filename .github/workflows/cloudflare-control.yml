name: Cloudflare Control Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-control.yml'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-travel-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRAVEL_SYNC_KEY: ${{ secrets.TRAVEL_SYNC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare secrets
        id: ready
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$TRAVEL_SYNC_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and TRAVEL_SYNC_KEY."
          fi

      - name: Setup Node
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        if: steps.ready.outputs.ready == 'true'
        run: npm install --global wrangler@4

      - name: Ensure D1 database exists
        if: steps.ready.outputs.ready == 'true'
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          get_id() {
            wrangler d1 list --json | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                const list=JSON.parse(s);
                const db=list.find(x=>x.name==="travel-hub-db");
                if(db) process.stdout.write(db.uuid || db.id || "");
              });
            '
          }
          DB_ID="$(get_id)"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create travel-hub-db --location apac
            DB_ID="$(get_id)"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Create Worker files
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > worker.js <<'WORKER'
          const ALLOWED_ORIGINS = new Set(['https://spae11.github.io']);
          const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

          function cors(origin) {
            const h = {
              'Content-Type': 'application/json; charset=utf-8',
              'Cache-Control': 'no-store',
              'Vary': 'Origin'
            };
            if (origin && ALLOWED_ORIGINS.has(origin)) {
              h['Access-Control-Allow-Origin'] = origin;
              h['Access-Control-Allow-Headers'] = 'Authorization, Content-Type, X-Sync-Token';
              h['Access-Control-Allow-Methods'] = 'GET, PUT, POST, OPTIONS';
              h['Access-Control-Max-Age'] = '86400';
            }
            return h;
          }

          function json(data, status = 200, origin = '') {
            return new Response(JSON.stringify(data), { status, headers: cors(origin) });
          }

          function browserOriginAllowed(origin) {
            return Boolean(origin && ALLOWED_ORIGINS.has(origin));
          }

          function randomBytes(size) {
            const a = new Uint8Array(size);
            crypto.getRandomValues(a);
            return a;
          }

          function base64url(bytes) {
            let s = '';
            for (const b of bytes) s += String.fromCharCode(b);
            return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
          }

          function randomToken() { return base64url(randomBytes(32)); }
          function randomRoom() { return base64url(randomBytes(16)); }
          function randomCode() {
            const b = randomBytes(6);
            let out = '';
            for (let i = 0; i < 6; i++) out += CODE_CHARS[b[i] % CODE_CHARS.length];
            return out;
          }

          async function digest(text) {
            const data = new TextEncoder().encode(text);
            const buf = await crypto.subtle.digest('SHA-256', data);
            return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
          }

          async function tokenHash(token, env) {
            return digest(`${env.TRAVEL_SYNC_KEY}:${token}`);
          }

          function bearer(request) {
            const auth = request.headers.get('Authorization') || '';
            if (auth.startsWith('Bearer ')) return auth.slice(7).trim();
            return (request.headers.get('X-Sync-Token') || '').trim();
          }

          async function deviceRoom(request, env) {
            const token = bearer(request);
            if (!token || token.length < 20 || !env.TRAVEL_SYNC_KEY) return null;
            const hash = await tokenHash(token, env);
            const row = await env.DB.prepare('SELECT room_id FROM sync_devices WHERE token_hash = ?').bind(hash).first();
            return row?.room_id || null;
          }

          async function createPairCode(env, roomId) {
            for (let i = 0; i < 8; i++) {
              const code = randomCode();
              try {
                await env.DB.prepare("INSERT INTO sync_pair_codes (code, room_id, expires_at) VALUES (?, ?, datetime('now','+15 minutes'))")
                  .bind(code, roomId).run();
                return code;
              } catch (_) {}
            }
            throw new Error('pair_code_failed');
          }

          async function createDevice(env, roomId) {
            const token = randomToken();
            const hash = await tokenHash(token, env);
            await env.DB.prepare('INSERT INTO sync_devices (token_hash, room_id) VALUES (?, ?)').bind(hash, roomId).run();
            return token;
          }

          async function stateGet(env, roomId, origin) {
            const row = await env.DB.prepare('SELECT payload, version, updated_at FROM sync_rooms WHERE room_id = ?').bind(roomId).first();
            if (!row) return json({ ok: false, error: 'room_not_found' }, 404, origin);
            let payload = {};
            try { payload = JSON.parse(row.payload || '{}'); } catch (_) {}
            return json({ ok: true, payload, version: Number(row.version) || 0, updatedAt: row.updated_at }, 200, origin);
          }

          async function statePut(request, env, roomId, origin) {
            const length = Number(request.headers.get('Content-Length') || 0);
            if (length > 1000000) return json({ ok: false, error: 'payload_too_large' }, 413, origin);
            let body;
            try { body = await request.json(); } catch (_) { return json({ ok: false, error: 'invalid_json' }, 400, origin); }
            if (!body || typeof body.payload !== 'object' || body.payload === null || Array.isArray(body.payload)) {
              return json({ ok: false, error: 'invalid_payload' }, 400, origin);
            }
            const payloadText = JSON.stringify(body.payload);
            if (payloadText.length > 1000000) return json({ ok: false, error: 'payload_too_large' }, 413, origin);

            const current = await env.DB.prepare('SELECT version FROM sync_rooms WHERE room_id = ?').bind(roomId).first();
            if (!current) return json({ ok: false, error: 'room_not_found' }, 404, origin);
            const version = Number(current.version) || 0;
            if (body.baseVersion !== undefined && Number(body.baseVersion) !== version) {
              const latest = await env.DB.prepare('SELECT payload, version, updated_at FROM sync_rooms WHERE room_id = ?').bind(roomId).first();
              let latestPayload = {};
              try { latestPayload = JSON.parse(latest.payload || '{}'); } catch (_) {}
              return json({ ok: false, error: 'version_conflict', payload: latestPayload, version: Number(latest.version) || 0, updatedAt: latest.updated_at }, 409, origin);
            }

            const result = await env.DB.prepare("UPDATE sync_rooms SET payload = ?, version = version + 1, updated_at = datetime('now') WHERE room_id = ? AND version = ?")
              .bind(payloadText, roomId, version).run();
            if (!result.success || !result.meta || result.meta.changes !== 1) return json({ ok: false, error: 'version_conflict' }, 409, origin);
            const saved = await env.DB.prepare('SELECT version, updated_at FROM sync_rooms WHERE room_id = ?').bind(roomId).first();
            return json({ ok: true, version: Number(saved.version), updatedAt: saved.updated_at }, 200, origin);
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const origin = request.headers.get('Origin') || '';

              if (request.method === 'OPTIONS') {
                if (!browserOriginAllowed(origin)) return new Response(null, { status: 403 });
                return new Response(null, { status: 204, headers: cors(origin) });
              }

              if (url.pathname === '/health') {
                return json({ ok: true, service: 'travel-hub-api', database: Boolean(env.DB), pairing: true }, 200, origin);
              }

              if (url.pathname === '/api/pair/create' && request.method === 'POST') {
                if (!browserOriginAllowed(origin)) return json({ ok: false, error: 'forbidden_origin' }, 403, origin);
                const roomId = randomRoom();
                await env.DB.prepare("INSERT INTO sync_rooms (room_id, payload, version, updated_at) VALUES (?, '{}', 0, datetime('now'))").bind(roomId).run();
                const token = await createDevice(env, roomId);
                const code = await createPairCode(env, roomId);
                return json({ ok: true, roomId, token, pairCode: code, expiresMinutes: 15 }, 201, origin);
              }

              if (url.pathname === '/api/pair/join' && request.method === 'POST') {
                if (!browserOriginAllowed(origin)) return json({ ok: false, error: 'forbidden_origin' }, 403, origin);
                let body = {};
                try { body = await request.json(); } catch (_) {}
                const code = String(body.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (code.length !== 6) return json({ ok: false, error: 'invalid_pair_code' }, 400, origin);
                const row = await env.DB.prepare("SELECT room_id FROM sync_pair_codes WHERE code = ? AND used_at IS NULL AND expires_at > datetime('now')").bind(code).first();
                if (!row) return json({ ok: false, error: 'invalid_or_expired_code' }, 404, origin);
                const token = await createDevice(env, row.room_id);
                await env.DB.prepare("UPDATE sync_pair_codes SET used_at = datetime('now') WHERE code = ?").bind(code).run();
                return json({ ok: true, roomId: row.room_id, token }, 200, origin);
              }

              const roomId = await deviceRoom(request, env);
              if (!roomId) return json({ ok: false, error: 'unauthorized_device' }, 401, origin);

              if (url.pathname === '/api/pair/code' && request.method === 'POST') {
                const code = await createPairCode(env, roomId);
                return json({ ok: true, pairCode: code, expiresMinutes: 15 }, 200, origin);
              }

              if (url.pathname === '/api/state') {
                if (request.method === 'GET') return stateGet(env, roomId, origin);
                if (request.method === 'PUT') return statePut(request, env, roomId, origin);
                return json({ ok: false, error: 'method_not_allowed' }, 405, origin);
              }

              return json({ ok: false, error: 'not_found' }, 404, origin);
            }
          };
          WORKER

          cat > wrangler.generated.jsonc <<EOF
          {
            "name": "travel-hub-api",
            "main": "worker.js",
            "compatibility_date": "2026-08-15",
            "workers_dev": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "travel-hub-db",
                "database_id": "$DB_ID"
              }
            ]
          }
          EOF

      - name: Apply D1 schema
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          wrangler d1 execute travel-hub-db --remote --command="CREATE TABLE IF NOT EXISTS sync_rooms (room_id TEXT PRIMARY KEY, payload TEXT NOT NULL DEFAULT '{}', version INTEGER NOT NULL DEFAULT 0, updated_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); CREATE TABLE IF NOT EXISTS sync_devices (token_hash TEXT PRIMARY KEY, room_id TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); CREATE INDEX IF NOT EXISTS idx_sync_devices_room ON sync_devices(room_id); CREATE TABLE IF NOT EXISTS sync_pair_codes (code TEXT PRIMARY KEY, room_id TEXT NOT NULL, expires_at TEXT NOT NULL, used_at TEXT, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP); CREATE INDEX IF NOT EXISTS idx_sync_pair_room ON sync_pair_codes(room_id); DELETE FROM sync_pair_codes WHERE expires_at <= datetime('now') OR used_at IS NOT NULL;"

      - name: Deploy Worker
        if: steps.ready.outputs.ready == 'true'
        run: wrangler deploy --config wrangler.generated.jsonc

      - name: Set server-only sync secret
        if: steps.ready.outputs.ready == 'true'
        run: printf '%s' "$TRAVEL_SYNC_KEY" | wrangler secret put TRAVEL_SYNC_KEY --config wrangler.generated.jsonc

      - name: Summary
        if: steps.ready.outputs.ready == 'true'
        run: |
          echo "### Cloudflare Travel Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: travel-hub-api" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: travel-hub-db" >> "$GITHUB_STEP_SUMMARY"
          echo "- Device pairing: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- TRAVEL_SYNC_KEY: server-side only" >> "$GITHUB_STEP_SUMMARY"
