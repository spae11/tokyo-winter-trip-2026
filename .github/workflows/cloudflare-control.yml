name: Cloudflare Control Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-control.yml'
      - 'cloudflare/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-travel-hub
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRAVEL_SYNC_KEY: ${{ secrets.TRAVEL_SYNC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare secrets
        id: ready
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$TRAVEL_SYNC_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing Cloudflare repository secrets."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Ensure D1 database exists
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          get_id() {
            wrangler d1 list --json | node -e '
              let s="";
              process.stdin.on("data",d=>s+=d);
              process.stdin.on("end",()=>{
                const list=JSON.parse(s);
                const db=list.find(x=>x.name==="travel-hub-db");
                if(db) process.stdout.write(db.uuid || db.id || "");
              });
            '
          }
          DB_ID="$(get_id)"
          if [ -z "$DB_ID" ]; then
            wrangler d1 create travel-hub-db --location apac
            DB_ID="$(get_id)"
          fi
          test -n "$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure R2 media bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if ! wrangler r2 bucket list | grep -q 'travel-hub-media'; then
            wrangler r2 bucket create travel-hub-media
          fi
          wrangler r2 bucket list | grep 'travel-hub-media'

      - name: Generate Wrangler config
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        shell: bash
        run: |
          cat > wrangler.generated.jsonc <<EOF
          {
            "name": "travel-hub-api",
            "main": "cloudflare/worker.js",
            "compatibility_date": "2026-08-16",
            "workers_dev": true,
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "travel-hub-db",
                "database_id": "$DB_ID"
              }
            ],
            "r2_buckets": [
              {
                "binding": "MEDIA",
                "bucket_name": "travel-hub-media"
              }
            ]
          }
          EOF

      - name: Apply D1 schema
        run: wrangler d1 execute travel-hub-db --remote --file=cloudflare/schema.sql

      - name: Deploy Worker
        run: wrangler deploy --config wrangler.generated.jsonc

      - name: Set server-only sync secret
        shell: bash
        run: printf '%s' "$TRAVEL_SYNC_KEY" | wrangler secret put TRAVEL_SYNC_KEY --config wrangler.generated.jsonc

      - name: Verify Worker health
        shell: bash
        run: |
          sleep 2
          curl --fail --silent --show-error https://travel-hub-api.mlrkdee44.workers.dev/health

      - name: Summary
        shell: bash
        run: |
          echo "### Cloudflare Travel Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: travel-hub-api" >> "$GITHUB_STEP_SUMMARY"
          echo "- D1: travel-hub-db" >> "$GITHUB_STEP_SUMMARY"
          echo "- R2: travel-hub-media" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full app state + media sync + recovery enabled" >> "$GITHUB_STEP_SUMMARY"
