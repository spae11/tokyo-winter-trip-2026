name: China Trips v71

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/china-trips-v71.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch China trips and scalable selectors
        run: python .github/scripts/china-trips-v71.py
      - name: Commit migration
        run: |
          rm -f .github/scripts/china-trips-v71.py
          rm -f .github/workflows/china-trips-v71.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Scale trip selectors and finish China trips'
          git push
