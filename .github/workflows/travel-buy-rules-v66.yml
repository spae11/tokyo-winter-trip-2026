name: Travel Buy Rules v66

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/travel-buy-rules-v66.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply travel buying and rules update
        run: python .github/scripts/travel-buy-rules-v66.py
      - name: Commit app update
        run: |
          rm -f .github/scripts/travel-buy-rules-v66.py
          rm -f .github/workflows/travel-buy-rules-v66.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add SIM gear buying guide and travel restriction links'
          git push
