name: Finalize colorful Journey logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-latest-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Point every app icon reference to the restored colorful logo
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root=Path('.')

          # Main HTML: force a brand-new Safari URL so an old black icon cannot win cache lookup.
          p=root/'index.html'
          text=p.read_text(encoding='utf-8')
          text=text.replace('manifest.webmanifest?v=59','manifest.webmanifest?v=60')
          text=text.replace('our-journey-icon-180-v3.png','our-journey-icon-180-v4.png')
          text=text.replace('our-journey-icon-192-v3.png','our-journey-icon-192-v4.png')
          text=text.replace('our-journey-icon-512-v3.png','our-journey-icon-512-v4.png')
          text=re.sub(r'(our-journey-icon-(?:180|192|512)-v4\.png)\?v=\d+',r'\1?v=60',text)
          p.write_text(text,encoding='utf-8')

          # Manifest: use only the exact restored colorful artwork under new URLs.
          p=root/'manifest.webmanifest'
          m=json.loads(p.read_text(encoding='utf-8'))
          m['start_url']='/tokyo-winter-trip-2026/?pwa=22'
          m['icons']=[
            {'src':'/tokyo-winter-trip-2026/our-journey-icon-180-v4.png','sizes':'180x180','type':'image/png','purpose':'any'},
            {'src':'/tokyo-winter-trip-2026/our-journey-icon-192-v4.png','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':'/tokyo-winter-trip-2026/our-journey-icon-512-v4.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
          ]
          p.write_text(json.dumps(m,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # Service worker: new cache generation and no references to black v2/v3 assets.
          p=root/'sw.js'
          text=p.read_text(encoding='utf-8')
          text=re.sub(r"const CACHE='our-journey-v\d+'","const CACHE='our-journey-v60'",text,count=1)
          for size in ('180','192','512'):
            text=text.replace(f'our-journey-icon-{size}-v2.png',f'our-journey-icon-{size}-v4.png')
            text=text.replace(f'our-journey-icon-{size}-v3.png',f'our-journey-icon-{size}-v4.png')
          text=re.sub(r'\?v=59', '?v=60', text)
          text=text.replace('ui-motion-v1.js?v=2','ui-motion-v1.js?v=3')
          p.write_text(text,encoding='utf-8')
          PY

          # Remove every known black/generated icon so it cannot be selected later.
          rm -f our-journey-icon-180-v2.png our-journey-icon-192-v2.png our-journey-icon-512-v2.png
          rm -f our-journey-icon-180-v3.png our-journey-icon-192-v3.png our-journey-icon-512-v3.png

          # This helper is one-time only; remove it after the migration.
          rm -f .github/workflows/restore-latest-logo.yml

      - name: Commit final logo cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use restored colorful Earth logo everywhere' || exit 0
          git push
