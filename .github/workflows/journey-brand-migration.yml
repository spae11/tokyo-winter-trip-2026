name: One-time Journey brand migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/journey-brand-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor brand and migrate storage hooks
        run: node .github/scripts/brand-migration.mjs

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Journey brand migration"
          git push origin HEAD:main
