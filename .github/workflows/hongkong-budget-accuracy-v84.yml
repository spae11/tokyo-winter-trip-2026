name: Hong Kong Budget Accuracy v84

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hongkong-budget-accuracy-v84.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply accurate Hong Kong budget and hotel options
        run: python3 scripts/hongkong_budget_accuracy_v84.py
      - name: Validate JavaScript
        run: |
          node --check trip-tools-v1.js
          node --check plan-extras-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hongkong/index.html trip-tools-v1.js plan-extras-v1.js sw.js index.html manifest.webmanifest
          git commit -m "Refine Hong Kong 70K budget and hotel options" || exit 0
          git push
