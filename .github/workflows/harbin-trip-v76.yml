name: Harbin Trip v76

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harbin-trip-v76.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply Harbin integration
        run: python .github/scripts/harbin-v76.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -q "DATA.harbin" trip-tools-v1.js
          grep -q "PLAN.harbin" memory-journal-v3.js
          grep -q "Harbin + Yabuli + Snow Town" plan-first-v1.js
          grep -q "harbin/index.html" sw.js
          grep -q "our-journey-v76" sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan-first-v1.js plan-first-v2.js plan-first-v2.css trip-tools-v1.js memory-journal-v3.js plan-extras-v1.js plan-memory-link-v2.js index.html sw.js manifest.webmanifest
          git commit -m 'Integrate Harbin winter trip across Our Journey'
          git push
