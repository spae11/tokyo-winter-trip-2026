name: App UX v72

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-ux-v72.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch app UX
        run: python .github/scripts/app-ux-v72.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html trip-cloud-sync-v3.js plan-first-v1.js plan-first-v2.css plan-first-v2.js sw.js manifest.webmanifest
          git diff --cached --check
          git commit -m 'Fix trip preview, back navigation and PWA speed'
          git push
