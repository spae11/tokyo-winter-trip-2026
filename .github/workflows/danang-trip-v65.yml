name: Da Nang Trip v65

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/danang-trip-v65.yml'
      - '.github/scripts/danang_patch_v65.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply integration
        run: python .github/scripts/danang_patch_v65.py
      - name: Remove temporary patch files
        run: rm -f .github/scripts/danang_patch_v65.py .github/workflows/danang-trip-v65.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Da Nang trip and shared couple planning tools'
          git push
