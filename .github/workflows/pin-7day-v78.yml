name: PIN 7 Day v78

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pin-7day-v78.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set PIN lifetime to seven days
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:180]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Root page: prevent gate flash when the 7-day authorization is still fresh.
          replace_once('index.html',
            "<script>try{localStorage.removeItem('ourJourneyUnlockedV1');if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')document.documentElement.classList.add('journey-unlocked')}catch(e){}</script>",
            "<script>try{const k='ourJourneyPinVerifiedAtV1',ttl=604800000,t=Number(localStorage.getItem(k)||0),fresh=t>0&&Date.now()-t>=0&&Date.now()-t<ttl;localStorage.removeItem('ourJourneyUnlockedV1');if(!fresh&&t)localStorage.removeItem(k);if(fresh||sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')document.documentElement.classList.add('journey-unlocked')}catch(e){}</script>")

          old="const gate=document.getElementById('gate'),form=document.getElementById('login'),pin=document.getElementById('pin'),err=document.getElementById('err');function unlock(animated=true){sessionStorage.setItem('hubUnlocked','1');sessionStorage.setItem('unlock','1');try{localStorage.removeItem('ourJourneyUnlockedV1');document.documentElement.classList.add('journey-unlocked')}catch(e){}document.body.classList.add('unlocked');if(animated){gate.classList.add('leaving');setTimeout(()=>gate.classList.add('hide'),520)}else gate.classList.add('hide')};if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')unlock(false);else setTimeout(()=>pin.focus(),120);"
          new="const gate=document.getElementById('gate'),form=document.getElementById('login'),pin=document.getElementById('pin'),err=document.getElementById('err'),PIN_AUTH_KEY='ourJourneyPinVerifiedAtV1',PIN_AUTH_TTL=7*24*60*60*1000;function pinAuthFresh(){try{const t=Number(localStorage.getItem(PIN_AUTH_KEY)||0),age=Date.now()-t;if(t>0&&age>=0&&age<PIN_AUTH_TTL)return true;if(t)localStorage.removeItem(PIN_AUTH_KEY)}catch(e){}return false}function unlock(animated=true,remember=false){sessionStorage.setItem('hubUnlocked','1');sessionStorage.setItem('unlock','1');try{localStorage.removeItem('ourJourneyUnlockedV1');if(remember)localStorage.setItem(PIN_AUTH_KEY,String(Date.now()));document.documentElement.classList.add('journey-unlocked')}catch(e){}document.body.classList.add('unlocked');if(animated){gate.classList.add('leaving');setTimeout(()=>gate.classList.add('hide'),520)}else gate.classList.add('hide')};if(pinAuthFresh()||sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')unlock(false);else setTimeout(()=>pin.focus(),120);"
          replace_once('index.html',old,new)
          replace_once('index.html',"if(pin.value==='1234')unlock(true);else", "if(pin.value==='1234')unlock(true,true);else")
          replace_once('index.html',"if(pin.value==='1234')unlock(true);else if(pin.value.length===4)", "if(pin.value==='1234')unlock(true,true);else if(pin.value.length===4)")
          replace_once('index.html','manifest.webmanifest?v=77','manifest.webmanifest?v=78')
          replace_once('index.html','ourJourneySWReloadV77','ourJourneySWReloadV78')
          replace_once('index.html','./sw.js?v=77','./sw.js?v=78')

          # Keep the 7-day local authorization private to each device.
          replace_once('trip-cloud-sync-v3.js',
            "const EXCLUDED=/^(?:travelToolsCloudV\\d+|ourJourneyUnlockedV1)$/;",
            "const EXCLUDED=/^(?:travelToolsCloudV\\d+|ourJourneyUnlockedV1|ourJourneyPinVerifiedAtV1)$/;")

          # Service Worker root restoration must use the same 7-day rule.
          sw=Path('sw.js'); s=sw.read_text(encoding='utf-8')
          if "const CACHE='our-journey-v77';" not in s: raise SystemExit('missing v77 cache')
          s=s.replace("const CACHE='our-journey-v77';","const CACHE='our-journey-v78';",1)
          oldcheck="if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1'||localStorage.getItem('ourJourneyUnlockedV1')==='1')"
          newcheck="if((()=>{try{const t=Number(localStorage.getItem('ourJourneyPinVerifiedAtV1')||0),age=Date.now()-t;return(t>0&&age>=0&&age<604800000)||sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1'}catch(e){return sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1'}})())"
          if oldcheck not in s: raise SystemExit('missing SW root auth condition')
          s=s.replace(oldcheck,newcheck,1)
          # Bump injected app assets together so installed PWAs refresh coherently.
          s=s.replace('?v=76','?v=78')
          sw.write_text(s,encoding='utf-8')

      - name: Validate
        run: |
          grep -q "ourJourneyPinVerifiedAtV1" index.html
          grep -q "PIN_AUTH_TTL=7\*24\*60\*60\*1000" index.html
          grep -q "ourJourneyPinVerifiedAtV1" trip-cloud-sync-v3.js
          grep -q "our-journey-v78" sw.js
          grep -q "sw.js?v=78" index.html
          ! grep -q "localStorage.getItem('ourJourneyUnlockedV1')==='1'" sw.js
          node --check sw.js
          node --check trip-cloud-sync-v3.js
          git diff --check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js trip-cloud-sync-v3.js
          git commit -m 'Require PIN once every seven days v78'
          git push
