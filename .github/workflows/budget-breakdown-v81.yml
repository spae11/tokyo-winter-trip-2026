name: Budget Breakdown v81

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/budget-breakdown-v81.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore per-category budgets
        run: python3 scripts/budget_breakdown_v81.py
      - name: Validate JavaScript
        run: node --check plan-extras-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan-extras-v1.js sw.js index.html manifest.webmanifest
          git commit -m "Restore detailed trip budget breakdowns" || exit 0
          git push
