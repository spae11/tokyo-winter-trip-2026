name: Souvenir Guide v80

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/souvenir-guide-v80.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply souvenir guide
        run: python3 scripts/souvenir_patch_v80.py
      - name: Validate JavaScript
        run: node --check plan-extras-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plan-extras-v1.js sw.js index.html manifest.webmanifest
          git commit -m "Add souvenir guides with images to every trip" || exit 0
          git push
