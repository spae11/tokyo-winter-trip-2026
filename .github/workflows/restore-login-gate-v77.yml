name: Restore Login Gate v77

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-login-gate-v77.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore session-only login gate
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:140]}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          patch('index.html',
            "<script>try{if(localStorage.getItem('ourJourneyUnlockedV1')==='1')document.documentElement.classList.add('journey-unlocked')}catch(e){}</script>",
            "<script>try{localStorage.removeItem('ourJourneyUnlockedV1');if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')document.documentElement.classList.add('journey-unlocked')}catch(e){}</script>")

          patch('index.html',
            "try{localStorage.setItem('ourJourneyUnlockedV1','1');document.documentElement.classList.add('journey-unlocked')}catch(e){}",
            "try{localStorage.removeItem('ourJourneyUnlockedV1');document.documentElement.classList.add('journey-unlocked')}catch(e){}")

          patch('index.html',
            "if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1'||localStorage.getItem('ourJourneyUnlockedV1')==='1')unlock(false);",
            "if(sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1')unlock(false);")

          patch('index.html', "manifest.webmanifest?v=76", "manifest.webmanifest?v=77")
          patch('index.html', "ourJourneySWReloadV76", "ourJourneySWReloadV77")
          patch('index.html', "./sw.js?v=76", "./sw.js?v=77")

          patch('sw.js', "const CACHE='our-journey-v76';", "const CACHE='our-journey-v77';")
          patch('sw.js',
            "try{localStorage.setItem('ourJourneyUnlockedV1','1')}catch(e){}",
            "try{localStorage.removeItem('ourJourneyUnlockedV1')}catch(e){}")
          patch('sw.js',
            "||localStorage.getItem('ourJourneyUnlockedV1')==='1'",
            "")

      - name: Validate login behavior
        run: |
          grep -q "our-journey-v77" sw.js
          grep -q "sw.js?v=77" index.html
          grep -q "ourJourneySWReloadV77" index.html
          ! grep -q "localStorage.setItem('ourJourneyUnlockedV1','1')" index.html
          ! grep -q "localStorage.setItem('ourJourneyUnlockedV1','1')" sw.js
          grep -q "sessionStorage.getItem('hubUnlocked')==='1'||sessionStorage.getItem('unlock')==='1'" index.html
          node --check sw.js
          git diff --check

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Restore session login gate and bump PWA v77'
          git push
