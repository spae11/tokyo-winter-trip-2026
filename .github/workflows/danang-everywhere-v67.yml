name: Da Nang Everywhere v67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/danang-everywhere-v67.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Extend existing trip systems to Da Nang
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n==s:
                  print('unchanged', path)
              else:
                  p.write_text(n, encoding='utf-8'); print('updated', path)

          # 1) Memory Journal: add Da Nang as a first-class trip using the same existing PLAN model.
          def journal(s):
              if 'PLAN.danang=' not in s:
                  marker='}};\nfunction state()'
                  plan="""}};\nPLAN.danang={country:'vietnam',name:'Da Nang + Hoi An 6D5N',flag:'🇻🇳',fallbackStart:'',days:[{day:1,title:'Arrival • My Khe • Dragon Bridge 🇻🇳',places:['Da Nang International Airport','Airport → Hotel','HAIAN Beach Hotel & Spa','My Khe Beach','Dragon Bridge','Belanga Bay Da Nang']},{day:2,title:'Ba Na Hills • Golden Bridge 🌉',places:['Ba Na Hills','Sun World Ba Na Hills','Golden Bridge','French Village Ba Na Hills','HAIAN Beach Hotel & Spa']},{day:3,title:'Marble Mountains • Hoi An 🏮',places:['Marble Mountains','Da Nang → Hoi An','Little Riverside Hoi An','Hoi An Ancient Town','Japanese Covered Bridge','Thu Bon River']},{day:4,title:'Hoi An • Coconut Village 🛶',places:['Cam Thanh Coconut Village','Basket Boat Hoi An','Hoi An Ancient Town','Little Riverside Hoi An']},{day:5,title:'Son Tra • Da Nang 🌊',places:['Hoi An → Da Nang','Son Tra Peninsula','Linh Ung Pagoda','My Khe Beach','Han Market','Dragon Bridge']},{day:6,title:'Souvenir • Airport 👋',places:['Check-out','Han Market','Da Nang International Airport']}]};\nfunction state()"""
                  if marker not in s: raise SystemExit('journal PLAN marker missing')
                  s=s.replace(marker,plan,1)
              s=s.replace("if(m.country==='hongkong')return'hongkong';return m.trip||'other'", "if(m.country==='hongkong')return'hongkong';if(m.country==='vietnam'||m.country==='vn')return'danang';return m.trip||'other'")
              if "if(trip==='danang')" not in s:
                  needle="if(trip==='hongkong'){if(/lantau|disney|ngong|tung chung|buddha|citygate/.test(rg+' '+nm))return /disney/.test(nm)?p.days[1]:p.days[4];if(/hong kong island|central|wan chai|causeway|peak/.test(rg+' '+nm))return /central|pmq/.test(nm)?p.days[2]:p.days[3]}return null}"
                  repl="if(trip==='hongkong'){if(/lantau|disney|ngong|tung chung|buddha|citygate/.test(rg+' '+nm))return /disney/.test(nm)?p.days[1]:p.days[4];if(/hong kong island|central|wan chai|causeway|peak/.test(rg+' '+nm))return /central|pmq/.test(nm)?p.days[2]:p.days[3]}if(trip==='danang'){if(/ba na|golden bridge|french village/.test(rg+' '+nm))return p.days[1];if(/marble|ngu hanh son/.test(rg+' '+nm))return p.days[2];if(/hoi an|ancient town|thu bon|japanese covered/.test(rg+' '+nm))return /coconut|cam thanh|basket/.test(rg+' '+nm)?p.days[3]:p.days[2];if(/son tra|linh ung|han market/.test(rg+' '+nm))return p.days[4]}return null}"
                  if needle not in s: raise SystemExit('journal infer marker missing')
                  s=s.replace(needle,repl,1)
              s=s.replace('<button class="mj-pill" data-mj-trip="hongkong">🇭🇰 Hong Kong</button></div>', '<button class="mj-pill" data-mj-trip="hongkong">🇭🇰 Hong Kong</button><button class="mj-pill" data-mj-trip="danang">🇻🇳 Da Nang</button></div>')
              s=s.replace("for(const k of ['tokyo','hongkong'])", "for(const k of ['tokyo','hongkong','danang'])")
              return s
          rw('memory-journal-v3.js', journal)

          # 2) New Memory form: destination-plan choices for Vietnam/Da Nang/Hoi An.
          def loc(s):
              if 'PLAN.vietnam=' not in s:
                  marker='  };\n\n  const sheet='
                  add="""  };\n  PLAN.vietnam={trip:'Da Nang + Hoi An 6D5N',regions:{\n    'Da Nang':['Da Nang International Airport','HAIAN Beach Hotel & Spa','My Khe Beach','Dragon Bridge','Belanga Bay Da Nang','Ba Na Hills','Sun World Ba Na Hills','Golden Bridge','French Village Ba Na Hills','Marble Mountains','Son Tra Peninsula','Linh Ung Pagoda','Han Market'],\n    'Hoi An':['Little Riverside Hoi An','Hoi An Ancient Town','Japanese Covered Bridge','Thu Bon River','Cam Thanh Coconut Village','Basket Boat Hoi An']\n  }};\n\n  const sheet="""
                  if marker not in s: raise SystemExit('location PLAN marker missing')
                  s=s.replace(marker,add,1)
              return s
          rw('memory-location-v2.js', loc)

          # 3) Worldwide country canonicalization: VN must resolve to the same `vietnam` key used by the plan.
          def global_loc(s):
              s=s.replace("const special={JP:'japan',HK:'hongkong',TH:'thailand'},specialCode={japan:'JP',hongkong:'HK',thailand:'TH'};", "const special={JP:'japan',HK:'hongkong',TH:'thailand',VN:'vietnam'},specialCode={japan:'JP',hongkong:'HK',thailand:'TH',vietnam:'VN'};")
              return s
          rw('memory-global-location-v1.js', global_loc)

          # 4) Country flags/names in Recap, Moments and Unified Map.
          for f in ['memory-recap-v1.js','memory-moments-v1.js']:
              rw(f, lambda s: s.replace("{japan:'JP',hongkong:'HK',thailand:'TH'}", "{japan:'JP',hongkong:'HK',thailand:'TH',vietnam:'VN',vn:'VN'}"))

          def umap(s):
              s=s.replace("m.country==='thailand'?'🇹🇭':'🌍'", "m.country==='thailand'?'🇹🇭':(m.country==='vietnam'||m.country==='vn')?'🇻🇳':'🌍'")
              s=s.replace("m.country==='thailand'?'Thailand':m.country||''", "m.country==='thailand'?'Thailand':(m.country==='vietnam'||m.country==='vn')?'Vietnam':m.country||''")
              s=s.replace("const trip=(m.trip==='tokyo'||m.trip==='hongkong')?m.trip:'all';", "const trip=(m.trip==='tokyo'||m.trip==='hongkong'||m.trip==='danang')?m.trip:'all';")
              return s
          rw('unified-memory-map-v1.js', umap)

          # 5) Plan → Memory handoff title must not label Da Nang as Hong Kong.
          def inbox(s):
              old="payload.trip==='tokyo'?'Tokyo Winter Trip':'Hong Kong Trip'"
              new="({tokyo:'Tokyo Winter Trip',hongkong:'Hong Kong Trip',danang:'Da Nang + Hoi An Trip'}[payload.trip]||'Trip')"
              return s.replace(old,new)
          rw('memory-plan-inbox-v2.js', inbox)

          # 6) Root memory save/inference compatibility: normalize any legacy `vn` records to `vietnam` during display is handled by modules above.

          # Bump PWA asset version so installed iPhone/Android apps actually receive this integration.
          def sw(s):
              s=s.replace("const CACHE='our-journey-v66'", "const CACHE='our-journey-v67'")
              s=s.replace('?v=66','?v=67')
              return s
          rw('sw.js', sw)
          rw('index.html', lambda s: s.replace("ourJourneySWReloadV66","ourJourneySWReloadV67").replace("sw.js?v=66","sw.js?v=67"))

          # Audit likely trip-specific JS. This is deliberately report-only, not a blind replacement.
          print('\n=== trip-specific audit (Tokyo + Hong Kong but no Da Nang) ===')
          for p in sorted(Path('.').glob('*.js')):
              t=p.read_text(encoding='utf-8',errors='ignore').lower()
              if 'tokyo' in t and 'hongkong' in t and 'danang' not in t:
                  print('CHECK',p)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/danang-everywhere-v67.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make Da Nang first-class across memories and trip selectors'
          git push
