name: Trip Parity + Yunnan v68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trip-parity-yunnan-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch existing systems and add Yunnan trip
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          def rw(path, fn):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=fn(s)
              if n!=s:
                  p.write_text(n,encoding='utf-8'); print('UPDATED',path)
              else: print('UNCHANGED',path)

          def rep(s, old, new, label):
              if old not in s:
                  print('MISS',label)
                  return s
              return s.replace(old,new,1)

          # ---- Plan-first dashboard: 4 equal first-class trips ----
          def planfirst(s):
              s=s.replace("const isTokyo=path.startsWith(BASE+'tokyo/'),isHK=path.startsWith(BASE+'hongkong/'),isDaNang=path.startsWith(BASE+'danang/'),isPlan=isTokyo||isHK||isDaNang,isRoot=path===BASE||path===BASE+'index.html';",
                          "const isTokyo=path.startsWith(BASE+'tokyo/'),isHK=path.startsWith(BASE+'hongkong/'),isDaNang=path.startsWith(BASE+'danang/'),isYunnan=path.startsWith(BASE+'yunnan/'),isPlan=isTokyo||isHK||isDaNang||isYunnan,isRoot=path===BASE||path===BASE+'index.html';")
              s=s.replace("const tripKey=isTokyo?'tokyo':isHK?'hongkong':isDaNang?'danang':'';",
                          "const tripKey=isTokyo?'tokyo':isHK?'hongkong':isDaNang?'danang':isYunnan?'yunnan':'';")
              old="danang:{key:'danang',name:'Da Nang + Hoi An 6D5N',flag:'🇻🇳',href:'./danang/',planHref:'../danang/',fallbackStart:'',days:6,accent:'Da Nang'}};"
              new="danang:{key:'danang',name:'Da Nang + Hoi An 6D5N',flag:'🇻🇳',href:'./danang/',planHref:'../danang/',fallbackStart:'',days:6,accent:'Da Nang'},yunnan:{key:'yunnan',name:'Yunnan • Kunming + Dali 6D5N',flag:'🇨🇳',href:'./yunnan/',planHref:'../yunnan/',fallbackStart:'',days:6,accent:'Yunnan'}};"
              s=s.replace(old,new)
              s=s.replace("const who=a.trip==='tokyo'?'Tokyo':a.trip==='hongkong'?'Hong Kong':a.trip==='danang'?'Da Nang':'Trip';",
                          "const who=a.trip==='tokyo'?'Tokyo':a.trip==='hongkong'?'Hong Kong':a.trip==='danang'?'Da Nang':a.trip==='yunnan'?'Yunnan':'Trip';")
              s=s.replace("x.trip==='tokyo'?'🇯🇵 Tokyo':x.trip==='hongkong'?'🇭🇰 Hong Kong':'🇻🇳 Da Nang'",
                          "x.trip==='tokyo'?'🇯🇵 Tokyo':x.trip==='hongkong'?'🇭🇰 Hong Kong':x.trip==='danang'?'🇻🇳 Da Nang':'🇨🇳 Yunnan'")
              return s
          rw('plan-first-v1.js',planfirst)

          def planfirstcss(s):
              if 'data-pfx-focus="yunnan"' not in s:
                  needle="body.pfx-root.pfx-v2:has(.pfx-focus[data-pfx-focus=\"danang\"].on) .pfx-trip-main:before{background-image:linear-gradient(180deg,transparent 55%,#0000003d),url('https://images.unsplash.com/photo-1559592413-7cec4d0cae2b?auto=format&fit=crop&w=1400&q=82')}"
                  add=needle+"\nbody.pfx-root.pfx-v2:has(.pfx-focus[data-pfx-focus=\"yunnan\"].on) .pfx-trip-main:before{background-image:linear-gradient(180deg,transparent 55%,#0000003d),url('https://images.unsplash.com/photo-1537531383496-f4749b8032cf?auto=format&fit=crop&w=1400&q=82')}"
                  s=s.replace(needle,add)
              return s
          rw('plan-first-v2.css',planfirstcss)

          # ---- Trip Tools data + China map provider ----
          def triptools(s):
              if 'DATA.yunnan=' not in s:
                  marker="function defaults(){return{selected:location.pathname.includes('/hongkong/')?'hongkong':location.pathname.includes('/danang/')?'danang':'tokyo'"
                  block="""DATA.yunnan={name:'Yunnan • Kunming + Dali 6D5N',emoji:'🇨🇳',city:'Kunming / Dali',country:'China',tz:'Asia/Shanghai',currency:'CNY',budget:48000,start:'',center:[25.04,102.71],zoom:7,\n days:[\n  {title:'Arrival • Kunming Old Street',items:[['หลังถึง KMG','Kunming Changshui International Airport','昆明长水国际机场'],['15:00','Kunming city center','昆明老街'],['16:30','Shuncheng Mosque','顺城清真寺'],['18:30','Nanping Street','南屏步行街']]},\n  {title:'Stone Forest Day Trip',items:[['07:30','ออกจาก Kunming','昆明市'],['09:30','Stone Forest Scenic Area','石林风景区'],['16:30','กลับ Kunming','昆明市'],['18:30','Muslim dinner','顺城街清真美食']]},\n  {title:'High-speed rail → Dali',items:[['08:00','Kunming South Railway Station','昆明南站'],['10:30','Dali Railway Station','大理站'],['13:00','Dali Ancient City','大理古城'],['17:00','Old Town evening','大理古城']]},\n  {title:'Erhai • Xizhou • Three Pagodas',items:[['08:30','Erhai Lake','洱海'],['10:30','Xizhou Ancient Town','喜洲古镇'],['14:30','Three Pagodas','崇圣寺三塔文化旅游区'],['18:00','Dali Ancient City','大理古城']]},\n  {title:'Dali → Kunming • Dianchi',items:[['09:00','Dali Railway Station','大理站'],['12:00','Kunming South','昆明南站'],['14:30','Dianchi / Haigeng Park','滇池海埂公园'],['17:30','Dounan Flower Market','斗南花市']]},\n  {title:'Kunming • Airport',items:[['09:00','Kunming Old Street / souvenir','昆明老街'],['11:00','Muslim lunch','顺城清真寺'],['ก่อนบิน 3 ชม.','Kunming Changshui Airport','昆明长水国际机场']]}\n ],\n places:[['🏙️','Kunming Old Street',25.038,102.704,'sight'],['🕌','Shuncheng Mosque',25.0385,102.706,'muslim'],['🪨','Stone Forest',24.817,103.324,'sight'],['🚄','Kunming South Railway Station',24.873,102.861,'station'],['🏮','Dali Ancient City',25.695,100.165,'sight'],['🌊','Erhai Lake',25.75,100.20,'sight'],['🏘️','Xizhou Ancient Town',25.851,100.13,'sight'],['🛕','Three Pagodas',25.706,100.147,'sight'],['🌅','Dianchi Haigeng Park',24.956,102.664,'sight'],['🌷','Dounan Flower Market',24.891,102.788,'shop'],['✈️','Kunming Changshui Airport',25.102,102.929,'station']],\n muslim:[['🕌 Shuncheng Mosque','顺城清真寺','Prayer • Kunming'],['🍜 Shuncheng Muslim food','顺城街清真美食','Kunming halal area'],['🍽️ Dali halal search','大理清真餐厅','ใช้ Amap หา 清真 / halal ใกล้ Location']]}\n};\n"""
                  if marker in s:s=s.replace(marker,block+marker,1)
                  else: print('MISS triptools insert marker')
              s=s.replace("function defaults(){return{selected:location.pathname.includes('/hongkong/')?'hongkong':location.pathname.includes('/danang/')?'danang':'tokyo',dates:{tokyo:DATA.tokyo.start,hongkong:'',danang:''},budgets:{tokyo:65000,hongkong:55000,danang:45000},done:{tokyo:{},hongkong:{},danang:{}},expenses:[],wallet:[],notes:[],api:{},lastTab:'today'};}",
                          "function defaults(){return{selected:location.pathname.includes('/hongkong/')?'hongkong':location.pathname.includes('/danang/')?'danang':location.pathname.includes('/yunnan/')?'yunnan':'tokyo',dates:{tokyo:DATA.tokyo.start,hongkong:'',danang:'',yunnan:''},budgets:{tokyo:65000,hongkong:55000,danang:45000,yunnan:48000},done:{tokyo:{},hongkong:{},danang:{},yunnan:{}},expenses:[],wallet:[],notes:[],api:{},lastTab:'today'};}")
              s=s.replace("state.dates=Object.assign({tokyo:DATA.tokyo.start,hongkong:'',danang:''},state.dates||{});state.budgets=Object.assign({tokyo:65000,hongkong:55000,danang:45000},state.budgets||{});state.done=state.done||{tokyo:{},hongkong:{}};",
                          "state.dates=Object.assign({tokyo:DATA.tokyo.start,hongkong:'',danang:'',yunnan:''},state.dates||{});state.budgets=Object.assign({tokyo:65000,hongkong:55000,danang:45000,yunnan:48000},state.budgets||{});state.done=Object.assign({tokyo:{},hongkong:{},danang:{},yunnan:{}},state.done||{});")
              s=s.replace("function maps(q){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}",
                          "function maps(q){if(state.selected==='yunnan')return'https://uri.amap.com/search?keyword='+encodeURIComponent(q)+'&view=map&src=ourjourney&callnative=1';return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}")
              return s
          rw('trip-tools-v1.js',triptools)

          # ---- Plan Extras: readiness/apps/rules/emergency for mainland China ----
          def extras(s):
              s=s.replace("const trip=path.includes('/tokyo/')?'tokyo':path.includes('/hongkong/')?'hongkong':path.includes('/danang/')?'danang':null;",
                          "const trip=path.includes('/tokyo/')?'tokyo':path.includes('/hongkong/')?'hongkong':path.includes('/danang/')?'danang':path.includes('/yunnan/')?'yunnan':null;")
              if 'DATA.yunnan=' not in s:
                  marker="  const d=DATA[trip];"
                  block="""DATA.yunnan={emoji:'🇨🇳',seasonTitle:'ช่วงที่เหมาะกับทริปนี้',seasonBadge:'แนะนำ • มี.ค.–พ.ค. / ก.ย.–พ.ย.',seasonLead:'Kunming + Dali อากาศเดินเที่ยวสบายและวิวภูเขา/ทะเลสาบสวย',seasonText:'Yunnan อยู่ทางตะวันตกเฉียงใต้ของจีนและเดินทางต่อ Kunming–Dali ด้วยรถไฟความเร็วสูงได้ จึงเหมาะกับทริป 6 วันโดยไม่ต้องใช้เที่ยวบินภายในประเทศ',seasonChips:['🌸 Kunming','🏮 Dali Old Town','🌊 Erhai','🚄 High-speed rail'],seasonNote:'Yunnan ระดับความสูงต่างกันมาก อากาศเช้า–ค่ำเย็นกว่าที่คิด ควรเช็กพยากรณ์ใกล้วันจริง',groups:[{title:'เอกสาร & Booking',icon:'🪪',items:[['passport','พาสปอร์ต + รูป/สำเนา'],['flight','ตั๋ว Bangkok ↔ Kunming'],['insurance','ประกันเดินทาง'],['hotel','Booking Kunming + Dali'],['train','จองรถไฟ Kunming ↔ Dali และกรอกชื่อ/Passport ให้ตรง'],['entry','เช็กเงื่อนไขเข้าเมืองจีนล่าสุดก่อนบิน']]},{title:'เงิน เน็ต & แอปจีน',icon:'📱',items:[['esim','eSIM/SIM ที่ระบุการใช้งานใน China'],['alipay','ติดตั้ง Alipay + ผูกบัตรต่างประเทศก่อนบิน'],['amap','ติดตั้ง Amap / Gaode Maps และเซฟ Location'],['didi','DiDi / Ride-hailing พร้อมใช้งาน'],['wechat','WeChat สำรองสำหรับติดต่อ/ชำระเงิน'],['cash','พก RMB สดเล็กน้อยเป็นแผนสำรอง']]},{title:'เสื้อผ้า & เดินทาง',icon:'🧥',items:[['layer','เสื้อคลุมแบบ Layer สำหรับเช้า/ค่ำ'],['shoes','รองเท้าเดินสบาย'],['sun','กันแดด + แว่นกันแดด'],['umbrella','ร่มพับ'],['power','Power bank ที่ค่า Wh ชัดเจน'],['adapter','Universal Adapter / หัวปลั๊กที่เหมาะกับอุปกรณ์']]},{title:'Muslim-friendly',icon:'🕌',items:[['prayer','Prayer/Qibla app'],['mat','ผ้าปูละหมาดพกพา'],['mosque','เซฟ Shuncheng Mosque 顺城清真寺'],['halal','ใน Amap ค้นคำว่า 清真 / 清真餐厅'],['snack','พก snack halal สำรองวัน Stone Forest / รถไฟ'],['translate','เซฟชื่อร้าน/โรงแรมเป็นภาษาจีนไว้ในมือถือ']]}]};\n"""
                  if marker in s:s=s.replace(marker,block+marker,1)
                  else: print('MISS extras DATA marker')
              if 'yunnan:[' not in s[s.find('const APP_DATA='):s.find('function injectTravelApps')]:
                  marker="    tokyo:["
                  block="""    yunnan:[\n      {icon:'🗺️',name:'Amap / Gaode Maps 高德地图',badge:'ต้องมี • Maps หลัก',platform:'iPhone + Android',desc:'ใช้เป็นแผนที่หลักในจีนแผ่นดินใหญ่สำหรับค้น POI เดินทาง รถสาธารณะ และเรียกรถ • รองรับบริการสำหรับนักท่องเที่ยวต่างชาติมากขึ้น',url:'https://www.amap.com/'},\n      {icon:'💙',name:'Alipay',badge:'ต้องมี • Payment',platform:'iPhone + Android',desc:'ผูกบัตรต่างประเทศก่อนเดินทาง ใช้ QR จ่ายร้านค้าและเปิดบริการ Transport/Taxi ได้ในแอปเดียว',url:'https://www.alipay.com/'},\n      {icon:'🚕',name:'DiDi Greater China',badge:'แนะนำ • Ride hailing',platform:'iPhone + Android',desc:'เรียกรถใน Kunming/Dali และรองรับผู้ใช้ต่างชาติด้วยเบอร์โทรต่างประเทศ/บัตรสากลตามคู่มือทางการจีน',url:'https://www.didiglobal.com/'},\n      {icon:'💬',name:'WeChat / Weixin Pay',badge:'แนะนำ',platform:'iPhone + Android',desc:'ใช้ติดต่อร้าน/โรงแรมและเป็นช่องทางชำระเงินสำรอง โดยสามารถผูกบัตรต่างประเทศที่รองรับได้',url:'https://www.wechat.com/'},\n      {icon:'🚄',name:'China Railway 12306 / Trip.com',badge:'แนะนำ • รถไฟ',platform:'Web + App',desc:'ใช้เช็กรอบและตั๋วรถไฟ Kunming ↔ Dali • 12306 มีเว็บภาษาอังกฤษ ส่วน Trip.com ใช้ง่ายสำหรับนักท่องเที่ยว',url:'https://www.12306.cn/en/index.html'}\n    ],\n"""
                  s=s.replace(marker,block+marker,1)
              old="const note=trip==='hongkong'?'ฮ่องกงไม่จำเป็นต้องใช้ DiDi/Alipay เป็นหลักเหมือนจีนแผ่นดินใหญ่ — Octopus + MTR Mobile + Uber เหมาะกับทริปนี้มากกว่า':trip==='danang'?'เวียดนามใช้ Grab + Google Maps เป็นหลัก • เตรียมเงิน VND สดไว้สำหรับร้านเล็กและตลาด':'ญี่ปุ่นใช้ IC Card + Maps เป็นหลัก ส่วนแท็กซี่ติด GO ไว้เป็นตัวสำรอง';"
              new="const note=trip==='yunnan'?'จีนแผ่นดินใหญ่ใช้ Amap / Gaode Maps เป็น Maps หลัก • Alipay เป็น Payment หลัก • DiDi สำหรับเรียกรถ • Location ในแพลนจีนจะเปิด Amap ก่อน Google Maps':trip==='hongkong'?'ฮ่องกงไม่จำเป็นต้องใช้ DiDi/Alipay เป็นหลักเหมือนจีนแผ่นดินใหญ่ — Octopus + MTR Mobile + Uber เหมาะกับทริปนี้มากกว่า':trip==='danang'?'เวียดนามใช้ Grab + Google Maps เป็นหลัก • เตรียมเงิน VND สดไว้สำหรับร้านเล็กและตลาด':'ญี่ปุ่นใช้ IC Card + Maps เป็นหลัก ส่วนแท็กซี่ติด GO ไว้เป็นตัวสำรอง';"
              s=s.replace(old,new)
              # China-specific rules, using the existing rule cards.
              if "yunnan:{buyNote:" not in s:
                  marker="    danang:{buyNote:"
                  block="""    yunnan:{buyNote:'จีนแผ่นดินใหญ่: เตรียม Amap + Alipay ก่อนบิน • Power bank ควรมีค่า Wh ชัด และถ้ามีเที่ยวบินภายในจีนต้องตรวจเครื่องหมาย CCC/3C โดยเฉพาะ',rules:[\n      {icon:'🔋',title:'Power bank บนเที่ยวบินภายในจีน',level:'สำคัญมาก',text:'ตั้งแต่ 28 มิ.ย. 2025 เที่ยวบินภายในประเทศจีนห้าม Power bank ที่ไม่มีเครื่องหมาย CCC/3C ชัดเจน เครื่องหมายไม่ชัด หรือเป็นรุ่นที่ถูกเรียกคืน • เส้น Kunming–Dali ในแพลนนี้ใช้รถไฟ จึงหลีกเลี่ยงประเด็นนี้ระหว่างเมือง แต่เที่ยวบินอื่นต้องเช็ก',url:'https://www.caac.gov.cn/English/News/202507/t20250709_227894.html',link:'CAAC'},\n      {icon:'🛃',title:'ของห้าม/ของต้องสำแดงเข้าจีน',level:'ศุลกากร',text:'อาวุธ วัตถุระเบิด ยาเสพติด สารพิษ และสินค้า/พืช/สัตว์บางประเภทถูกห้ามหรือควบคุม • ของใช้ส่วนตัวต้องอยู่ในปริมาณสมเหตุสมผล และของที่ไม่แน่ใจให้เลือกช่อง Declare',url:'https://english.customs.gov.cn/statics/88707c1e-aa4e-40ca-a968-bdbdbb565e4f.html',link:'China Customs'},\n      {icon:'🗺️',title:'Maps ในจีน',level:'แนะนำ',text:'ใช้ Amap / Gaode เป็น Maps หลักสำหรับ Location ในจีน • ระบบ Our Journey จะให้ปุ่ม Amap ก่อน และเก็บ Google Maps เป็นตัวสำรองเมื่อเหมาะสม',url:'https://uri.amap.com/search?keyword=%E6%98%86%E6%98%8E&view=map&src=ourjourney&callnative=1',link:'เปิด Amap'}]},\n"""
                  s=s.replace(marker,block+marker,1)
              # For a China trip, remove the generic future-China note because it is now a real active trip and redundant.
              s=s.replace("<div class=\"px-china-note\"><b>🇨🇳 หมายเหตุเผื่อทริปจีนในอนาคต</b><br>กฎ CCC/3C ของ Power bank ที่จีนประกาศตั้งแต่ 28 มิ.ย. 2025 ระบุชัดว่าใช้กับ <b>เที่ยวบินภายในประเทศจีน</b>: Power bank ที่ไม่มีเครื่องหมาย CCC ชัดเจน หรือเป็นรุ่นที่ถูกเรียกคืน ห้ามนำขึ้นเที่ยวบินภายในจีน ดังนั้นไม่ได้แปลว่า Power bank ทุกลูกที่ไม่มี CCC ถูกห้ามเพียงเพราะเดินทางเข้าประเทศจีน แต่ถ้ามีไฟลต์ต่อภายในจีนต้องเช็กเรื่องนี้จริงจัง <a href=\"https://www.caac.gov.cn/English/News/202507/t20250709_227894.html\" target=\"_blank\" rel=\"noopener\">CAAC ↗</a></div>",
                          "${trip!=='yunnan'?`<div class=\"px-china-note\"><b>🇨🇳 หมายเหตุเผื่อทริปจีน</b><br>กฎ CCC/3C ใช้กับเที่ยวบินภายในประเทศจีน • ถ้ามีไฟลต์ต่อในจีนให้เช็ก CAAC ก่อนเดินทาง</div>`:''}")
              s=s.replace("danang:{main:'ตำรวจ 113 • ดับเพลิง 114 • รถพยาบาล 115 • กู้ภัย 112',help:'Da Nang Visitor Center +84 236 355 0111',hotel:'HAIAN Beach Hotel & Spa / Little Riverside Hoi An'}",
