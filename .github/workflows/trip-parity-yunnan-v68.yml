name: Trip Parity Yunnan v68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trip-parity-yunnan-v68.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run migration
        run: python .github/scripts/trip-parity-yunnan-v68.py
      - name: Commit migration
        run: |
          rm -f .github/scripts/trip-parity-yunnan-v68.py
          rm -f .github/workflows/trip-parity-yunnan-v68.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Yunnan China trip and complete trip parity'
          git push
