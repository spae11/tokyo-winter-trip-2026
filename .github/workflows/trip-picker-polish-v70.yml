name: Trip Picker Polish v70

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trip-picker-polish-v70.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Polish responsive picker and provider text
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('trip-tools-v1.js');s=p.read_text(encoding='utf-8')
          old="$('#tt-map').innerHTML='<div class=\"tt-map-fallback\">แผนที่ออนไลน์โหลดไม่ได้ • ใช้ปุ่ม ${mapProvider()} ด้านล่างได้</div>'"
          new="$('#tt-map').innerHTML=`<div class=\"tt-map-fallback\">แผนที่ออนไลน์โหลดไม่ได้ • ใช้ปุ่ม ${mapProvider()} ด้านล่างได้</div>`"
          if old not in s: raise SystemExit('map fallback marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('trip-tools-v1.css');s=p.read_text(encoding='utf-8')
          old='.tt-trip-pick{display:flex;gap:7px;margin-bottom:10px}.tt-trip-pick button{flex:1;border:1px solid var(--tt-line);border-radius:15px;background:#fff;padding:10px;font:900 13px \'Noto Sans Thai\',system-ui,sans-serif}'
          new='.tt-trip-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:10px}.tt-trip-pick button{min-width:0;border:1px solid var(--tt-line);border-radius:15px;background:#fff;padding:10px 7px;font:900 12px \'Noto Sans Thai\',system-ui,sans-serif;white-space:nowrap}'
          if old not in s: raise SystemExit('picker css marker missing')
          s=s.replace(old,new,1)
          media='@media(max-width:680px){#tt-sheet{height:94dvh}'
          if media not in s: raise SystemExit('mobile css marker missing')
          s=s.replace(media,'@media(max-width:680px){.tt-trip-pick{grid-template-columns:repeat(2,minmax(0,1fr))}.tt-trip-pick button{padding:9px 6px}#tt-sheet{height:94dvh}',1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js');s=p.read_text(encoding='utf-8').replace("const CACHE='our-journey-v69'","const CACHE='our-journey-v70'").replace('?v=69','?v=70');p.write_text(s,encoding='utf-8')
          p=Path('index.html');s=p.read_text(encoding='utf-8').replace('ourJourneySWReloadV69','ourJourneySWReloadV70').replace('sw.js?v=69','sw.js?v=70');p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'grid-template-columns:repeat(4' trip-tools-v1.css
          grep -q 'grid-template-columns:repeat(2' trip-tools-v1.css
          grep -q 'our-journey-v70' sw.js
      - name: Commit
        run: |
          rm -f .github/workflows/trip-picker-polish-v70.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish four-trip picker and China map fallback'
          git push
