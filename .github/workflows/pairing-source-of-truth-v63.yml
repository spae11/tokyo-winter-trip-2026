name: Pairing Source of Truth v63

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pairing-source-of-truth-v63.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make re-pair use original cloud as source of truth
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('trip-cloud-sync-v3.js')
          s=p.read_text(encoding='utf-8')
          old="function resetPairingForJoin(){if(busy)return;if(!confirm('ยกเลิกการเชื่อม Cloud บนเครื่องนี้เพื่อจับคู่กับเครื่องเดิม? ข้อมูลในเครื่องจะไม่ถูกลบ'))return;cfg=baseCfg();try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.removeItem(OLD_CFG);localStorage.removeItem('travelHubMediaCloudV4');localStorage.removeItem('travelHubRemoteDeleteQueueV1')}catch{}notify('พร้อมจับคู่ใหม่ • ใส่ Pair Code จากเครื่องเดิมได้เลย');renderCard(true);setTimeout(()=>$('#tcs3-pair')?.focus(),120)}"
          new="function resetPairingForJoin(){if(busy)return;if(!confirm('ยกเลิก Cloud ที่เครื่องนี้เผลอสร้าง แล้วกลับไปจับคู่กับเครื่องเดิม? หลังจับคู่จะใช้ข้อมูลจาก Cloud ของเครื่องเดิมเป็นหลัก'))return;cfg=baseCfg();try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.removeItem(OLD_CFG);localStorage.removeItem('travelHubMediaCloudV4');localStorage.removeItem('travelHubRemoteDeleteQueueV1');sessionStorage.setItem('ourJourneyRePairReplaceV1','1')}catch{}notify('พร้อมจับคู่ใหม่ • ใส่ Pair Code จากเครื่องเดิมได้เลย');renderCard(true);setTimeout(()=>$('#tcs3-pair')?.focus(),120)}"
          if old not in s: raise SystemExit('reset function not found')
          s=s.replace(old,new,1)
          old="async function setupJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6)return notify('รหัสจับคู่ต้องมี 6 ตัว');if(busy)return;busy=true;try{const r=await joinRoom(code);cfg=Object.assign(baseCfg(),{roomId:r.roomId,token:r.token,auto:true,lastSync:Date.now()});saveCfg();busy=false;await ensureRecovery();await pullNow({merge:true,notice:false});notify('จับคู่และรับข้อมูลครบแล้ว')}catch(e){busy=false;handleError(e,e.status===404?'รหัสหมดอายุหรือไม่ถูกต้อง':'จับคู่ไม่สำเร็จ')}}"
          new="async function setupJoin(code){code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6)return notify('รหัสจับคู่ต้องมี 6 ตัว');if(busy)return;busy=true;try{const replaceFromOriginal=sessionStorage.getItem('ourJourneyRePairReplaceV1')==='1',r=await joinRoom(code);cfg=Object.assign(baseCfg(),{roomId:r.roomId,token:r.token,auto:true,lastSync:Date.now()});saveCfg();busy=false;await ensureRecovery();await pullNow({merge:!replaceFromOriginal,notice:false});sessionStorage.removeItem('ourJourneyRePairReplaceV1');notify(replaceFromOriginal?'จับคู่แล้ว • ใช้ข้อมูลจากเครื่องเดิมเป็นหลัก':'จับคู่และรับข้อมูลครบแล้ว')}catch(e){busy=false;handleError(e,e.status===404?'รหัสหมดอายุหรือไม่ถูกต้อง':'จับคู่ไม่สำเร็จ')}}"
          if old not in s: raise SystemExit('setupJoin not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js'); t=sw.read_text(encoding='utf-8').replace("const CACHE='our-journey-v62'","const CACHE='our-journey-v63'",1); sw.write_text(t,encoding='utf-8')
          idx=Path('index.html'); t=idx.read_text(encoding='utf-8').replace('ourJourneySWReloadV62','ourJourneySWReloadV63',1).replace("./sw.js?v=62","./sw.js?v=63",1); idx.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/pairing-source-of-truth-v63.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use original cloud as source of truth when re-pairing'
          git push
