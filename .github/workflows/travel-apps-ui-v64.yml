name: Travel Apps and Mobile UI v64

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/travel-apps-ui-v64.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python .github/scripts/travel_apps_ui_v64.py
      - name: Remove temporary patch files
        run: rm -f .github/workflows/travel-apps-ui-v64.yml .github/scripts/travel_apps_ui_v64.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add destination travel apps and fix mobile navigation UI'
          git push
