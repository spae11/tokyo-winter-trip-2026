name: Country Trip Picker v73

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/country-trip-picker-v73.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply country-first trip picker
        run: python .github/scripts/country-trip-picker-v73.py
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plan-first-v1.js plan-first-v1.css trip-tools-v1.js trip-tools-v1.css memory-journal-v3.js memory-journal-v3.css sw.js index.html manifest.webmanifest
          git diff --cached --check
          git commit -m 'Group trips by country in all selectors'
          git push
