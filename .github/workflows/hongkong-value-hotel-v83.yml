name: Hong Kong Value Hotel v83

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hongkong-value-hotel-v83.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Hong Kong hotel and budget correction
        run: python3 scripts/hongkong_value_hotel_v83.py
      - name: Validate JavaScript
        run: |
          node --check trip-tools-v1.js
          node --check plan-extras-v1.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trip-tools-v1.js plan-extras-v1.js hongkong/index.html sw.js index.html manifest.webmanifest
          git commit -m "Switch Hong Kong to value hotel and realistic 70K budget" || exit 0
          git push
