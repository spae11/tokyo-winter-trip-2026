name: Pairing Repair v62

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pairing-repair-v62.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add safe re-pair UI and prevent accidental new rooms
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('trip-cloud-sync-v3.js')
          s=p.read_text(encoding='utf-8')

          marker="async function setupNew(){if(busy)return;busy=true;try{"
          if marker not in s:
              raise SystemExit('setupNew marker not found')
          replacement=(
              "function resetPairingForJoin(){if(busy)return;if(!confirm('ยกเลิกการเชื่อม Cloud บนเครื่องนี้เพื่อจับคู่กับเครื่องเดิม? ข้อมูลในเครื่องจะไม่ถูกลบ'))return;"
              "cfg=baseCfg();try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg));localStorage.removeItem(OLD_CFG);localStorage.removeItem('travelHubMediaCloudV4');localStorage.removeItem('travelHubRemoteDeleteQueueV1')}catch{}"
              "notify('พร้อมจับคู่ใหม่ • ใส่ Pair Code จากเครื่องเดิมได้เลย');renderCard(true);setTimeout(()=>$('#tcs3-pair')?.focus(),120)}\n"
              "async function setupNew(){if(busy)return;if(!confirm('สร้างห้อง Cloud ใหม่จากเครื่องนี้? ถ้ามีเครื่องหลักอยู่แล้ว ให้กด “จับคู่จากเครื่องเดิม” แทน'))return;busy=true;try{"
          )
          s=s.replace(marker,replacement,1)

          s=s.replace('✨ สร้าง Cloud Sync จากเครื่องนี้','✨ สร้างห้องใหม่จากเครื่องนี้ (เครื่องหลัก)',1)

          old='<button id="tcs3-pair-new" class="tt-btn soft">📱 จับคู่เครื่องเพิ่ม</button></div>${pairValid()?'
          new='<button id="tcs3-pair-new" class="tt-btn soft">📱 สร้างรหัสให้เครื่องเพิ่ม</button><button id="tcs3-switch-room" class="tt-btn soft">🔗 จับคู่กับเครื่องเดิม</button></div><div class="tt-photo-note">ถ้าเครื่องนี้เผลอสร้าง Cloud แยกเอง ให้กด “จับคู่กับเครื่องเดิม” • ข้อมูลในเครื่องจะไม่หาย</div>${pairValid()?'
          if old not in s:
              raise SystemExit('connected buttons marker not found')
          s=s.replace(old,new,1)

          old_bind="$('#tcs3-pair-new',card).onclick=makePairCode;"
          new_bind="$('#tcs3-pair-new',card).onclick=makePairCode;$('#tcs3-switch-room',card).onclick=resetPairingForJoin;"
          if old_bind not in s:
              raise SystemExit('binding marker not found')
          s=s.replace(old_bind,new_bind,1)
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8').replace("const CACHE='our-journey-v61'","const CACHE='our-journey-v62'",1)
          sw.write_text(t,encoding='utf-8')

          idx=Path('index.html')
          t=idx.read_text(encoding='utf-8')
          t=t.replace("ourJourneySWReloadV61","ourJourneySWReloadV62",1)
          t=t.replace("./sw.js?v=61","./sw.js?v=62",1)
          idx.write_text(t,encoding='utf-8')
          PY
          rm -f .github/workflows/pairing-repair-v62.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add safe re-pair flow for second device'
          git push
