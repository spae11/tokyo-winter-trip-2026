name: Harbin v76 Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/harbin-v76-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix final Harbin routing details
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if new in s: return
              if old not in s: raise SystemExit(f'missing {path}: {old}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          patch('trip-tools-v1.js',
                "function mapProvider(){return ['yunnan','chongqing'].includes(state.selected)?'Amap':'Google Maps'}",
                "function mapProvider(){return ['yunnan','chongqing','harbin'].includes(state.selected)?'Amap':'Google Maps'}")
          patch('sw.js',
                "url.pathname.startsWith(BASE+'yunnan/')||url.pathname.startsWith(BASE+'chongqing/');const isRoot=",
                "url.pathname.startsWith(BASE+'yunnan/')||url.pathname.startsWith(BASE+'chongqing/')||url.pathname.startsWith(BASE+'harbin/');const isRoot=")
      - name: Validate critical JavaScript
        run: |
          node --check plan-first-v1.js
          node --check plan-first-v2.js
          node --check trip-tools-v1.js
          node --check memory-journal-v3.js
          node --check plan-extras-v1.js
          node --check plan-memory-link-v2.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('harbin/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('Harbin inline script missing')
          Path('/tmp/harbin-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/harbin-inline.js
          grep -q "Harbin + Yabuli + Snow Town 6D5N" plan-first-v1.js
          grep -q "DATA.harbin" trip-tools-v1.js
          grep -q "PLAN.harbin" memory-journal-v3.js
          grep -q "APP_DATA.harbin" plan-extras-v1.js
          grep -q "RULE_DATA.harbin" plan-extras-v1.js
          grep -q "BASE+'harbin/index.html'" sw.js
          grep -q "startsWith(BASE+'harbin/')" sw.js
      - name: Commit final fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trip-tools-v1.js sw.js
          git diff --cached --check
          git commit -m 'Finalize Harbin routing and Amap integration'
          git push
